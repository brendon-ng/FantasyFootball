name: Archive finalized data

# Captures newly finalized weeks into `data/raw/` and commits them.
#
# Kept separate from deploy.yml on purpose: deploy is read-only and runs many
# times a day, whereas this job writes to the repo and only needs to run once a
# week. `scripts/sync.ts` only ever persists data Sleeper has finalized and is
# idempotent, so a run with nothing new produces no commit at all.
#
# The push to main triggers deploy.yml normally, so the site picks up the new
# history without any extra wiring.

on:
  schedule:
    # Tuesday 12:00 UTC — after Monday Night Football has been scored and stat
    # corrections have settled.
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Sync finalized data from Sleeper
        run: npm run sync

      - name: Rebuild derived data
        run: npm run derive

      - name: Commit if anything finalized
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No newly finalized data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Archive finalized league data

          Automated by .github/workflows/archive.yml"
          git push
