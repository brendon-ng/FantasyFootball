name: Archive finalized data

# Captures newly finalized weeks into `data/` and commits them.
#
# COVERS EVERY LEAGUE ON EITHER SERVICE. `npm run sync` walks all of
# `config/leagues/*` and runs a Sleeper pass and an ESPN pass over each, so
# adding an ESPN league needs no change here — Sleeper seasons land in
# `raw/<season>/` and ESPN seasons in `manual/<season>.json`.
#
# Kept separate from deploy.yml on purpose: deploy is read-only and runs many
# times a day, whereas this job WRITES TO THE REPO. `scripts/sync.ts` only ever
# persists data the service has finalized and is idempotent, so a run with
# nothing new produces no commit at all — which is what makes a daily schedule free. Most days
# of the year this job does nothing but prove there was nothing to do.
#
# ADP refreshes on every run, so unlike the league data there is almost always
# something to commit. That is intended — the market moves daily and the site
# shows it live outside the locked window — but it does mean the "only commits
# when something finalized" property now really means "only commits when
# something changed".
#
# NOTE: this push does NOT trigger deploy.yml. GitHub deliberately suppresses
# workflow triggers for pushes made with the default GITHUB_TOKEN, to stop
# workflows recursively triggering themselves. The newly archived data therefore
# ships on deploy.yml's next scheduled run, which is at most six hours later.
# That is fine — the data being archived is by definition already finalized and
# in no hurry. If it ever needs to be immediate, dispatch deploy.yml by hand or
# push with a PAT instead.

on:
  schedule:
    # Midnight Pacific, daily.
    #
    # GITHUB CRON IS UTC ONLY — there is no timezone field — so this is 08:00 UTC:
    # exactly midnight PST, and 01:00 PDT through the summer. 07:00 UTC would be
    # exact in summer but 23:00 the PREVIOUS DAY in winter, which puts a "daily
    # midnight" run on the wrong date for half the year. Erring late keeps it on
    # the right day always.
    #
    # DAILY RATHER THAN WEEKLY because the job is idempotent: a run with nothing
    # newly finalized produces no commit. Weekly meant a week scored on Tuesday
    # morning could sit unarchived for seven days; now the worst case is one.
    # There is no risk of catching a week mid-correction either — sync commits
    # only what Sleeper's `last_scored_leg` says is final, so an early run simply
    # finds nothing and the next day's picks it up.
    #
    # Cost is one ~2-minute job a day. Actions minutes are unlimited on public
    # repos, and the only external cost is the 5MB player map, fetched at most
    # once per run — the budget Sleeper's docs ask for.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Sync finalized data from Sleeper and ESPN
        run: npm run sync

      # ESPN HAS NO EQUIVALENT OF `sync`. An ESPN-only league has no Sleeper
      # anchor, so the step above is a no-op for it and its data only ever moved
      # when somebody ran an importer by hand — which meant apartment-401 sat
      # frozen from the moment it was recovered. These two are the ones that keep
      # a live season current: adds, drops and trades, and the draft (which is
      # also the ONLY place a traded PICK is visible, since ESPN publishes those
      # on the pick itself and never in the transaction log).
      #
      # `seasons` and `lineups` deliberately stay manual. Neither has a
      # completion guard: `seasons` would write a half-played year into
      # `manual/`, which derive would then treat as a real finalized season and
      # collide with the live season page, and `lineups` enforces that started
      # points equal the scoreboard, which cannot hold until the scoreboard is
      # final. Run them once the season is over.
      #
      # ONLY THE CURRENT SEASON. Everything earlier is already committed and
      # immutable, so re-fetching it nightly buys nothing — and it is also what
      # keeps this working with no credentials: ESPN visibility is per SEASON,
      # and it is the season being PLAYED that is public. Asking for a league's
      # private history would 401 on every run and drown the real failures.
      #
      # ONE PROCESS PER LEAGUE PER JOB, which is what makes a failure local. A
      # thrown invariant, an OOM or an unhandled rejection in one league cannot
      # reach another, and the ones that worked still write their data. The step
      # then exits non-zero, and a step at the very end re-fails the run — so the
      # good data is committed AND the failure is impossible to miss.
      - name: Recover the current ESPN season, one league at a time
        id: espn
        continue-on-error: true
        run: |
          node -e '
            const fs = require("node:fs");
            const now = new Date();
            // An NFL season is named for the calendar year it STARTS in, so
            // January and February still belong to the year before.
            const season = now.getUTCMonth() <= 1 ? now.getUTCFullYear() - 1 : now.getUTCFullYear();
            for (const slug of fs.readdirSync("config/leagues").sort()) {
              const path = `config/leagues/${slug}/league.json`;
              if (!fs.existsSync(path)) continue;
              const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
              if (!cfg.features?.espnImport) continue;
              if (!(cfg.espnLeagueIds ?? {})[String(season)]) continue;
              console.log(`${slug} ${season}`);
            }
          ' > /tmp/espn-jobs

          if [ ! -s /tmp/espn-jobs ]; then
            echo "No league has an ESPN id for the current season — nothing to do."
            exit 0
          fi

          failed=""
          while read -r slug season; do
            for job in transactions drafts; do
              echo "::group::$slug $season — $job"
              npm run "import:espn:$job" -- --league="$slug" --season="$season" \
                || failed="$failed $slug/$job"
              echo "::endgroup::"
            done
          done < /tmp/espn-jobs

          if [ -n "$failed" ]; then
            echo "::warning::ESPN import failed for:$failed"
            exit 1
          fi

      - name: Rebuild derived data
        run: npm run derive

      # AFTER derive, which is what decides the keeper cycle season this prices
      # against — the cycle advances when a draft is archived, not when a season
      # ends, and derive is what archives it.
      #
      # `--auto` refreshes live.json every day and additionally takes the frozen
      # snapshot the first run after bylaws 1.7.2.2.1 opens the window (ten days
      # before the draft: the keeper deadline is three days out, ADP fixes a week
      # before that). It never overwrites an existing snapshot, so it can only
      # ever fire once per cycle.
      #
      # `continue-on-error` because beatadp is a THIRD PARTY. It being down or
      # changing its markup must not stop finalized league data being archived —
      # that data is the thing this job exists for, and a stale ADP column is a
      # far smaller problem than a week of results going uncommitted.
      - name: Refresh ADP, freezing it once the bylaw window opens
        continue-on-error: true
        run: npm run adp -- --auto

      # AFTER derive, which is what tells it which players a season involves — and
      # the only thing that fetches bye weeks. Without it a new season's byes are
      # never known, and every bye counts as a zero against a player's averages.
      # Cached in the output file, so a run with nothing new costs a few requests.
      - name: Recover player teams and bye weeks
        run: npm run import:player-teams

      - name: Commit if anything finalized
        run: |
          # data/ AND public/: `derive` rewrites public/mock/<slug>.json every run
          # and `sync` refreshes public/avatars/ and public/espn-players.json —
          # the ESPN-to-Sleeper player id map the live layer fetches in the
          # browser. All are tracked, and staging
          # only data/ meant those were produced in CI and silently thrown away —
          # the mock replay file drifted to whatever season was last committed by
          # hand, and a changed league avatar would never have landed.
          if [ -z "$(git status --porcelain data/ public/)" ]; then
            echo "Nothing new — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          git commit -m "Archive finalized league data

          Automated by .github/workflows/archive.yml"
          git push

      # LAST, so the leagues that DID work are already committed and pushed. A
      # step that failed under `continue-on-error` leaves the run green, and a
      # league that has quietly stopped importing is exactly the failure this
      # repo keeps getting bitten by — so the run is failed here instead.
      - name: Fail the run if any ESPN import failed
        if: steps.espn.outcome == 'failure'
        run: |
          echo "One or more ESPN imports failed — see the step above."
          exit 1
