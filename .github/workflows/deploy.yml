name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # GITHUB_REPOSITORY ("owner/repo") is set by Actions; next.config.ts reads it
      # to derive the /DenOpsFF basePath, so a repo rename can't break asset URLs.
      - name: Build static export
        run: npm run build

      # Guard against the classic Pages subpath regression: assets referenced from
      # the domain root instead of /<repo>/ silently 404 in production.
      - name: Verify asset URLs are prefixed with the repo subpath
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if grep -rEoh '(src|href)="/[^"]*"' out --include='*.html' \
             | grep -vE "\"/${repo}/" ; then
            echo "::error::Found root-relative URLs above that bypass the /${repo} basePath."
            echo "Wrap them with withBasePath() from @/lib/base-path."
            exit 1
          fi
          echo "All root-relative asset URLs are correctly prefixed."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
