name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The in-progress week is fetched at BUILD time (see lib/data.ts getLiveSeason),
  # so "live" scores are only as fresh as the last deploy. These crons keep that
  # gap under ~15 minutes during game windows and cost one build every 6h
  # otherwise. All times UTC; 17:00 UTC is 1pm ET, the Sunday early kickoff.
  #
  # NOTE: GitHub disables scheduled workflows after 60 days with no repo
  # activity. If live scores go stale in the offseason, that is why — push a
  # commit or hit "Run workflow" to re-arm them.
  schedule:
    - cron: "*/15 17-23 * * 0" # Sunday afternoon + evening games
    - cron: "*/15 0-4 * * 1" # Sunday night football (Monday UTC)
    - cron: "*/15 0-4 * * 2" # Monday night football (Tuesday UTC)
    - cron: "*/15 0-4 * * 5" # Thursday night football (Friday UTC)
    - cron: "0 */6 * * *" # Baseline refresh year-round

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # GITHUB_REPOSITORY ("owner/repo") is set by Actions; next.config.ts reads it
      # to derive the /DenOpsFF basePath, so a repo rename can't break asset URLs.
      - name: Build static export
        run: npm run build

      # Guard against the classic Pages subpath regression: assets referenced from
      # the domain root instead of /<repo>/ silently 404 in production.
      - name: Verify asset URLs are prefixed with the repo subpath
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if grep -rEoh '(src|href)="/[^"]*"' out --include='*.html' \
             | grep -vE "\"/${repo}/" ; then
            echo "::error::Found root-relative URLs above that bypass the /${repo} basePath."
            echo "Wrap them with withBasePath() from @/lib/base-path."
            exit 1
          fi
          echo "All root-relative asset URLs are correctly prefixed."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
